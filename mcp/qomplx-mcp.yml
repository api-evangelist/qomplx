name: QOMPLX MCP surface
status: candidate
summary: >-
  QOMPLX ships no MCP server. No hosted endpoint, no npx/pip package, no mention in any GitHub
  repository or on any reachable QOMPLX page. The tools below are a DERIVED candidate set — what an
  MCP server over the TimeEngine HTTP API would expose — recorded so the gap is legible. They are
  not implemented by anyone and no `MCPServer` pointer is emitted in apis.yml, because emitting one
  would credit QOMPLX with an agent surface it does not serve.
