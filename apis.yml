aid: qomplx
name: Qomplx
description: >-
  QOMPLX, Inc. is a Reston, Virginia research and technology company building risk-analytics
  and cybersecurity products — Identity Threat Detection and Response (ITDR) for Active
  Directory and cloud credentials, Managed Detection and Response (MDR), attack-surface
  monitoring, Active Directory security assessment, offensive security services and vCISO
  engagements — sold into finance, legal and insurance. Its underlying data platform,
  QOMPLX:OS (Q:OS), includes TimeEngine, a multi-dimensional time-series database and
  analytics engine that QOMPLX exposes over an HTTP and WebSocket interface. QOMPLX publishes
  first-party TimeEngine client libraries for Python, Java and Erlang on GitHub, but ships no
  OpenAPI, AsyncAPI, GraphQL SDL or Postman collection, and operates no public developer
  portal, API reference or pricing page. As of this pass its own website has been reduced to a
  single-page Ghost install and every content page listed in its sitemap returns a 301
  self-redirect loop.
