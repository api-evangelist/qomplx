apis:
- aid: qomplx-timeengine
  name: QOMPLX TimeEngine HTTP API
  description: >-
    TimeEngine (package name `mdtsdb`) is QOMPLX's multi-dimensional time-series database and
    analytics engine. It exposes an HTTP interface for event ingestion (`/api/v1/ingest`),
    query-language execution (`/api/v1/ql`), delayed/async result retrieval (`/api/v1/result`),
    key administration (`/api/v1/admin`) and a WebSocket streaming channel (`/api/v1/ws/{key}`).
    Requests are authenticated with an application or admin key plus an HMAC-SHA256 request
    signature, or with a Keycloak-issued OAuth 2.0 client-credentials bearer token. The surface
    documented here is derived from QOMPLX's own published client libraries; QOMPLX publishes no
    machine-readable specification for it.
  humanURL: https://github.com/QOMPLX-INC/te-python-client
  baseURL: https://{host}:{port}/api/v1
