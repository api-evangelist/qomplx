name: QOMPLX packages and client libraries
summary: >-
  QOMPLX publishes three first-party client libraries for its TimeEngine (mdtsdb) HTTP API —
  Python, Java and Erlang — plus a sample-use-case repository. None of them is published to a
  public package registry: PyPI, Maven Central, RubyGems, crates.io, npm and Hex were all
  queried unauthenticated and returned no QOMPLX package. Distribution is source-only from
  GitHub, and every library carries "Copyright 2015-2021 -- QOMPLX, Inc. -- All Rights
  Reserved. No License Granted." (GitHub reports the license as NOASSERTION), so these are
  published-but-unlicensed clients rather than open-source SDKs.
